[workspace]
members = ["crates/core", "crates/plugin", "crates/lecfig"]
# The plugin only builds for WebAssembly (`just plugin`), so plain `cargo build` skips it.
default-members = ["crates/core", "crates/lecfig"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Nizzi29/lecfig"

[workspace.dependencies]
lecfig-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Smaller plugin file; Typst loads it on every compile.
[profile.release.package.lecfig-plugin]
opt-level = "s"
