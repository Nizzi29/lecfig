[package]
name = "lecfig"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lecfig-core.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
typst = "0.15.1"
typst-layout = "0.15.1"
typst-render = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-packages", "datetime"] }
